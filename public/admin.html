<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Admin</title>
<body style="font:15px sans-serif;max-width:900px;margin:20px auto;padding:0 16px">
<input id="k" type="password" placeholder="Adminnyckel"> <button onclick="load()">Visa konton</button>
<p id="bar" hidden><button onclick="bulk('block')">Spärra markerade</button> <button onclick="bulk('delete')">Radera markerade</button></p>
<h3>Konton</h3><table id="t" border="1" cellpadding="6" style="border-collapse:collapse;width:100%"></table>
<h3>Spärrade</h3><p id="bar2" hidden><button onclick="unblock()">Upphäv markerade</button></p>
<table id="b" border="1" cellpadding="6" style="border-collapse:collapse;width:100%"></table>
<script>
// Local dev uses the same-origin proxy; anywhere else the Render API is used.
const api = () => location.hostname === 'localhost' ? '/api' : 'https://step-by-step-0rsz.onrender.com/api';
const esc = s => String(s).replace(/[&<>"']/g, c => '&#' + c.charCodeAt(0) + ';');
const post = (path, body) => fetch(api() + '/admin/' + path, { method: 'POST', headers: { 'x-admin-key': k.value, 'content-type': 'application/json' }, body: JSON.stringify(body) });
const checked = sel => [...document.querySelectorAll(sel + ':checked')].map(c => c.value);
const all = (sel, on) => document.querySelectorAll(sel).forEach(c => c.checked = on);
async function load() {
  const r = await fetch(api() + '/admin/people', { headers: { 'x-admin-key': k.value } });
  if (!r.ok) return t.innerHTML = '<tr><td>' + (await r.json()).error;
  const d = await r.json();
  bar.hidden = bar2.hidden = false;
  t.innerHTML = '<tr><th><input type=checkbox onclick="all(\'.p\',this.checked)"><th>Användarnamn<th>Visningsnamn<th>Grupper</tr>' + d.people.map(p =>
    `<tr><td><input class=p type=checkbox value="${esc(p.id)}"${p.hasLogin ? '' : ' disabled title="Saknar inloggning, kan bara raderas"'}><td>${esc(p.username || '–')}<td>${esc(p.name)}<td>${esc(p.groups.join(', '))}`).join('');
  b.innerHTML = '<tr><th><input type=checkbox onclick="all(\'.q\',this.checked)"><th>Spärrat användarnamn<th>Datum</tr>' + (d.blocked.length ? d.blocked.map(x =>
    `<tr><td><input class=q type=checkbox value="${esc(x.supabaseId)}"><td>${esc(x.username || '–')}<td>${new Date(x.at).toLocaleDateString('sv-SE')}`).join('') : '<tr><td colspan=3>Inga spärrade');
}
async function bulk(what) {
  const ids = checked('.p'); if (!ids.length) return alert('Markera minst ett konto.');
  if (!confirm((what === 'delete' ? 'Radera ' : 'Spärra ') + ids.length + ' konto(n)?' + (what === 'delete' ? ' Går inte att ångra.' : ''))) return;
  const r = await post(what, { ids }); if (!r.ok) alert((await r.json()).error); load();
}
async function unblock() {
  const supabaseIds = checked('.q'); if (!supabaseIds.length) return alert('Markera minst ett spärrat konto.');
  const r = await post('unblock', { supabaseIds }); if (!r.ok) alert((await r.json()).error); load();
}
</script>
